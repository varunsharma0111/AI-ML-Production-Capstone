# Template Secret for Capstone Application. DO NOT COMMIT REAL CREDENTIALS.
apiVersion: v1
kind: Secret
metadata:
  name: capstone-secrets
  labels:
    app.kubernetes.io/name: ai-ml-production-capstone
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION_SECRET"
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE_ME_IN_PRODUCTION_SECRET@postgres:5432/capstone"
  REDIS_URL: "redis://redis:6379/0"
