apiVersion: v1
kind: ConfigMap
metadata:
  name: capstone-config
  labels:
    app.kubernetes.io/name: ai-ml-production-capstone
    app.kubernetes.io/component: config
data:
  APP_ENV: "production"
  APP_NAME: "AI/ML Production Capstone API"
  LOG_LEVEL: "INFO"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "10"
  OIDC_ISSUER: "https://issuer.example.com/"
  OIDC_AUDIENCE: "ai-ml-production-capstone-api"
  OIDC_JWKS_URL: "https://issuer.example.com/.well-known/jwks.json"
  ALLOWED_JWT_ALGORITHMS: "RS256"
  VITE_API_URL: "https://api.capstone.local"
