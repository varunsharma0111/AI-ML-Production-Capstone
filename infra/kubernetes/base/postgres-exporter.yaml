apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    app.kubernetes.io/name: capstone-platform
    app.kubernetes.io/component: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone-platform
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capstone-platform
        app.kubernetes.io/component: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: capstone-secrets
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    app.kubernetes.io/name: capstone-platform
    app.kubernetes.io/component: postgres-exporter
spec:
  ports:
    - port: 9187
      targetPort: 9187
      name: metrics
  selector:
    app.kubernetes.io/name: capstone-platform
    app.kubernetes.io/component: postgres-exporter
