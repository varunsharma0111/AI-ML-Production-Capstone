apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: capstone-platform
    app.kubernetes.io/component: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone-platform
      app.kubernetes.io/component: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capstone-platform
        app.kubernetes.io/component: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:latest
          ports:
            - containerPort: 9121
              name: metrics
          env:
            - name: REDIS_ADDR
              value: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: capstone-platform
    app.kubernetes.io/component: redis-exporter
spec:
  ports:
    - port: 9121
      targetPort: 9121
      name: metrics
  selector:
    app.kubernetes.io/name: capstone-platform
    app.kubernetes.io/component: redis-exporter
