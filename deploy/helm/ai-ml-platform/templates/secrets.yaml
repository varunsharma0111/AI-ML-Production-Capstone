# Helm Secrets Template. DO NOT COMMIT REAL CREDENTIALS.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-ml-platform.fullname" . }}-secrets
  labels:
    {{- include "ai-ml-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
