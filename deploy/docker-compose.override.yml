# Docker Compose development override configuration for live hot-reloading
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/api:/app/apps/api
      - ./services:/app/services
      - ./ml:/app/ml
      - ./agent:/app/agent
      - ./messaging:/app/messaging
      - ./database:/app/database

  worker:
    volumes:
      - ./apps/api:/app/apps/api
      - ./services:/app/services
      - ./ml:/app/ml
      - ./agent:/app/agent
      - ./messaging:/app/messaging
      - ./database:/app/database
