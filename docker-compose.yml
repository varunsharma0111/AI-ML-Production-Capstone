services:
  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-capstone}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migration:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: capstone-migration
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/capstone}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://issuer.example.com/}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ai-ml-production-capstone-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://issuer.example.com/.well-known/jwks.json}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: capstone-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-AI/ML Production Capstone API}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/capstone}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://issuer.example.com/}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ai-ml-production-capstone-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://issuer.example.com/.well-known/jwks.json}
      ALLOWED_JWT_ALGORITHMS: ${ALLOWED_JWT_ALGORITHMS:-RS256}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: capstone-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/capstone}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://issuer.example.com/}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ai-ml-production-capstone-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://issuer.example.com/.well-known/jwks.json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: capstone-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: capstone-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-capstone}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: capstone-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: capstone-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts/alerts.yml:/etc/prometheus/alerts/alerts.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: capstone-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: capstone-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  redis_data:
