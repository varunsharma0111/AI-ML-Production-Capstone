[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ml-production-capstone"
version = "0.1.0"
description = "Production-oriented AI/ML platform capstone"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "boto3==1.36.23",
  "botocore==1.36.23",
  "fastapi==0.115.12",
  "greenlet==3.1.1",
  "prometheus-client==0.21.1",
  "pydantic-settings==2.10.1",
  "PyJWT[crypto]==2.10.1",
  "redis==5.2.1",
  "scikit-learn==1.6.1",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]==1.36.23",
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pre-commit==4.3.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[tool.setuptools]
package-dir = {"app" = "apps/api/app", "services" = "services", "ml" = "ml", "agent" = "agent", "messaging" = "messaging"}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "services", "ml", "agent", "messaging"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "apps/api"
files = ["apps/api", "services", "tests"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
